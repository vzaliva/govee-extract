[project]
name = "govee-extract"
version = "0.1.0"
description = "Read CO2, temperature and humidity from a GoveeLife Smart Air Quality Monitor (H5140)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vadim Zaliva", email = "lord@crocodile.org" }]
keywords = ["govee", "h5140", "co2", "air-quality", "influxdb", "grafana"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

# Intentionally empty: the collector is stdlib-only so it can run from cron on a
# small box without pulling a dependency tree. Please keep it that way.
dependencies = []

[project.urls]
Homepage = "https://github.com/vzaliva/govee-extract"
Repository = "https://github.com/vzaliva/govee-extract"

[project.scripts]
govee-h5140 = "govee_h5140:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["govee_h5140.py"]

[tool.hatch.build.targets.sdist]
include = ["govee_h5140.py", "test_govee_h5140.py", "grafana/", "README.md"]
